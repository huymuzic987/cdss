# Serves the built SPA and reverse-proxies the API paths to the backend
# container, mirroring the dev-only proxy in vite.config.ts.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml application/wasm image/svg+xml;

    # Vite's HTML shell contains the current hashed asset names and must be
    # revalidated after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed Vite assets are safe to cache for the lifetime of the filename.
    location ~* \.(?:css|js|mjs|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /trees {
        proxy_pass http://backend:8000/trees;
    }

    location /evaluate {
        proxy_pass http://backend:8000/evaluate;
    }

    location /fhir/ {
        proxy_pass http://backend:8000/fhir/;
    }

    location /dashboard {
        proxy_pass http://backend:8000/dashboard;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
