[project]
name = "cdss"
version = "0.1.0"
description = "Stateless hypertension CDSS backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "scalar-fastapi>=1.8.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=1.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "jsonschema>=4.26.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "database: integration test requiring the guarded local Docker PostgreSQL databases",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Generated migration scripts are not hand-formatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
