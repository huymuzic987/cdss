# Production deployment: db + backend + frontend + backup. Built and run on the
# target host by the Jenkinsfile. `docker compose` auto-loads a `.env` file
# next to this one for the ${...} substitutions below; that same .env is
# also passed into the backend container via env_file.
#
# Deployed with `docker compose -p cdss-<VERSION>` (see deploy/lib.sh and
# deploy/provision_stack.sh) so each deploy gets its own fully isolated
# stack. A stable router container, managed by deploy/promote_stack.sh, owns the
# public host port and atomically switches between these private frontends.
# Old application containers/images are pruned after promotion; three old
# PostgreSQL containers and volumes are retained as database rollbacks.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cdss_pgdata:/var/lib/postgresql/data
    networks: [cdss_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: cdss-backend:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Always points at the internal db service, regardless of what a
      # DATABASE_URL in .env might say, so the two can never drift apart.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [cdss_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
        VITE_PRODUCTION: ${PRODUCTION:-1}
    image: cdss-frontend:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      cdss_net:
        aliases:
          # Unique across release networks so the stable router can resolve
          # the selected release after an atomic nginx configuration reload.
          - cdss-frontend-${VERSION:-latest}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The fourth container only creates database backups. It writes through a
  # bind mount to a host directory that Jenkins excludes from rsync cleanup
  # and that is independent of every per-version Docker volume.
  backup:
    image: postgres:16
    user: "0:0"
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DEPLOY_VERSION: ${VERSION:-unknown}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-10}
      BACKUP_FILE_MODE: ${BACKUP_FILE_MODE:-0644}
      TZ: ${BACKUP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - ${BACKUP_HOST_DIR:-./persistent-backups}:/backups
      - ./deploy/backup_db.sh:/usr/local/bin/backup_db.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/backup_db.sh"]
    command: ["daemon"]
    depends_on:
      db:
        condition: service_healthy
    networks: [cdss_net]

networks:
  cdss_net:

volumes:
  cdss_pgdata:
